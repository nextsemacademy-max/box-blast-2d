name: Build Box Blast 2D Android .aab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Copy Web Dist to Flutter Assets
        run: |
          mkdir -p mobile/assets/web
          cp -r dist/* mobile/assets/web/

      - name: Build Release AAB
        run: |
          cd mobile
          flutter pub get
          flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box-blast-2d-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
