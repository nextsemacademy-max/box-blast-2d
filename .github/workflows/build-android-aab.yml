name: Build Box Blast 2D Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Copy Web Dist to Flutter Assets
        run: |
          mkdir -p mobile/assets/web
          cp -r dist/* mobile/assets/web/

      - name: Build Android APK
        run: |
          cd mobile
          chmod +x android/gradlew || true
          flutter pub get
          # Fix AGP 8 Proguard deprecation in cached plugins
          find ~/.pub-cache -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} + || true
          flutter build apk --release --no-tree-shake-icons -v

      - name: Build Release AAB
        run: |
          cd mobile
          flutter build appbundle --release --no-tree-shake-icons -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box-blast-2d-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box-blast-2d-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
