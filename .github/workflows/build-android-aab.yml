name: Build Box Blast 2D Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Copy Web Dist to Flutter Assets
        run: |
          mkdir -p mobile/assets/web
          cp -r dist/* mobile/assets/web/

      - name: Build Android APKs
        run: |
          cd mobile
          chmod +x android/gradlew || true
          flutter pub get
          echo "=== RUNNING FLUTTER BUILD APK DEBUG ==="
          flutter build apk --debug --verbose > build_log.txt 2>&1 || true
          echo "=== BUILD LOG SUMMARY ==="
          grep -E -i "error|exception|failure|failed" build_log.txt | head -n 50 || true
          echo "=== BUILD LOG LAST 60 LINES ==="
          tail -n 60 build_log.txt
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk was not generated!"
            exit 1
          fi
          echo "Building Release APK..."
          flutter build apk --release --no-tree-shake-icons

      - name: Build Release AAB
        run: |
          cd mobile
          flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-text
          path: mobile/build_log.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: box-blast-2d-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box-blast-2d-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
